version: "2"

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - revive
    - misspell
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    presets:
      - std-error-handling
    rules:
      # The hand-written agent loop is the owner's exercise and is not changed by lint fixes.
      - path: internal/agent/loop\.go
        linters: [errcheck, revive, staticcheck, unused, ineffassign, misspell, unconvert]

formatters:
  enable:
    - gofmt
