<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kertész Konténer – Budapest</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    /* A carousel: the track holds five full-width slides side by side, and
       the viewport box hides all but the first, as owl/swiper sliders do. */
    .slider { overflow: hidden; width: 100%; }
    .track { display: flex; width: 500%; }
    .slide { width: 20%; height: 200px; background: #cde; }
  </style>
</head>
<body>
  <header><button onclick="window.location.href='/ajanlat.html'">Ajánlatkérés</button></header>
  <div class="slider"><div class="track">
    <div class="slide">1</div><div class="slide">2</div><div class="slide">3</div><div class="slide">4</div><div class="slide">5</div>
  </div></div>
  <main><h1>Konténer rendelés</h1><p>Sitt és zöld hulladék elszállítása.</p></main>
  <footer><a href="/adatkezelesi-tajekoztato">Adatkezelési tájékoztató</a> · info@kertesz-kontener.example</footer>
</body>
</html>
