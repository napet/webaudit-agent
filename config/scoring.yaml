# Within-tier score weights. Start equal; tune after the first eval run.
# Replaying a snapshot re-scores with these without another LLM call.
weights:
  performance: 1
  accessibility: 1
  mobile: 1
  security: 1
  staleness: 1
  legal: 1
  datedness: 1

default_model: claude-opus-5-5

# USD per million tokens, Anthropic first-party API (checked 2026-10).
models:
  claude-opus-5-5:   {input_per_mtok: 4.00, output_per_mtok: 20.00}
  claude-sonnet-5-5: {input_per_mtok: 2.00, output_per_mtok: 10.00}
  claude-haiku-5-5:  {input_per_mtok: 0.10, output_per_mtok: 0.50}

# Agent mode (--agent) budgets per audit. Pages and screenshots are enforced by
# the tools, turns and cost by the loop. Starting guesses; tune after real runs.
agent:
  max_pages: 5
  max_screenshots: 3
  max_turns: 12
  max_cost_usd: 0.50
